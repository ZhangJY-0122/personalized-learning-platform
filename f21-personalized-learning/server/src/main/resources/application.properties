server.port=8083
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/f21_prep}
spring.datasource.username=${DB_USER:f21}
spring.datasource.password=${DB_PASSWORD:f21_local_demo_only}
spring.datasource.hikari.connection-init-sql=SET time_zone = '+00:00'
app.worker.enabled=${WORKER_ENABLED:true}
spring.sql.init.mode=never
spring.flyway.baseline-on-migrate=${FLYWAY_BASELINE_ON_MIGRATE:false}
spring.flyway.baseline-version=0
spring.flyway.connect-retries=20
spring.flyway.connect-retries-interval=2s
app.jwt.secret=${JWT_SECRET}
app.dashboard.root=${DASHBOARD_ROOT:..}
spring.jackson.deserialization.fail-on-unknown-properties=true
server.error.include-message=never
server.error.include-stacktrace=never
